<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نتیجه تخمین | پیرامید</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="dashboard-shell">

<!-- =========================== نوار بالای موبایل =========================== -->
<div class="mobile-topbar">
  <button class="icon-btn" aria-label="باز کردن منو">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <a href="index.html" class="brand" aria-label="پیرامید">
    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" width="30" height="30">
      <path d="M24 4 L44 40 H4 Z" fill="#1c3f9e"/>
      <path d="M24 4 L34 22 L14 22 Z" fill="#2f5fe0"/>
      <path d="M24 14 L44 40 H30 L20 22 Z" fill="#6a8ff2"/>
    </svg>
  </a>
</div>

<!-- =========================== محتوای نتیجه =========================== -->
<div class="result-wrap">

  <div class="result-title">
    <span style="font-size:15px;color:var(--text-muted);font-weight:600;">تراز: </span>
    <b>۷۷۲۹</b>
  </div>
  <p class="result-range">بازه تراز: ۷۵۷۴ تا ۷۸۸۳</p>

  <!-- گیج تراز -->
  <div class="gauge-card">
    <svg class="gauge-svg" viewBox="0 0 300 175" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gaugeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"  stop-color="#3b82f6"/>
          <stop offset="25%" stop-color="#17b283"/>
          <stop offset="50%" stop-color="#f5c518"/>
          <stop offset="75%" stop-color="#f5924a"/>
          <stop offset="100%" stop-color="#ef4444"/>
        </linearGradient>
      </defs>

      <!-- کمان اصلی -->
      <path d="M30,150 A120,120 0 0 1 270,150" fill="none"
            stroke="url(#gaugeGradient)" stroke-width="20" stroke-linecap="round"/>

      <!-- نشانگرهای بازه -->
      <circle class="gauge-tick" cx="43"  cy="96" r="7" fill="#17b283"/>
      <circle class="gauge-tick" cx="150" cy="30" r="7" fill="#f5c518"/>
      <circle class="gauge-tick" cx="257" cy="96" r="7" fill="#ef4444"/>

      <!-- عقربه -->
      <line class="gauge-needle" x1="150" y1="150" x2="150" y2="52"
            data-min="7574" data-max="7883" data-value="7729"/>
      <circle class="gauge-hub" cx="150" cy="150" r="10"/>
    </svg>
  </div>

  <!-- اسلایدر بازه -->
  <div class="slider-row">
    <div class="slider-track">
      <div class="slider-thumb"></div>
    </div>
    <div class="slider-labels">
      <span>خوش‌بینانه</span>
      <span>تراز شما</span>
      <span>بدبینانه</span>
    </div>
    <div class="slider-values">
      <span>۷۸۸۳</span>
      <span>۷۷۲۹</span>
      <span>۷۵۷۴</span>
    </div>
  </div>

  <!-- میانگین وزنی -->
  <div class="stat-box">
    <span>میانگین وزنی</span>
    <b>۳۰.۶۴٪</b>
  </div>

  <!-- گزارش خطا -->
  <a href="#" class="report-error">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22V3"/></svg>
    گزارش خطا
  </a>

  <!-- پیش‌نمایش بخش بعدی -->
  <div class="next-section-peek">
    <h4>درصدهای وارد شده</h4>
    <button class="icon-btn" aria-label="ویرایش درصدها">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
    </button>
  </div>
  <div class="percent-rows">
    <div class="percent-row"><b>ادبیات فارسی</b><span class="val">۷۸٪</span></div>
    <div class="percent-row"><b>عربی</b><span class="val">۶۵٪</span></div>
    <div class="percent-row"><b>زیست‌شناسی</b><span class="val">۸۴٪</span></div>
    <div class="percent-row"><b>شیمی</b><span class="val">۷۱٪</span></div>
  </div>

</div>

<!-- دکمه شناور اشتراک‌گذاری -->
<button class="fab-share" aria-label="اشتراک‌گذاری نتیجه">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
</button>

<script src="assets/js/main.js"></script>
</body>
</html>
